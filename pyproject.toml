[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickbuster"
version = "0.1.0"
description = "Multi-Threaded HTTP Directory & Endpoint Brute-Forcer with Baseline Calibration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
http-brute = "http_bruteforcer.cli:main"
quickbuster = "http_bruteforcer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["http_bruteforcer*", "quickbuster*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
